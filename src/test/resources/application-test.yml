spring:
  datasource:
    url: jdbc:h2:mem:fila_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

app:
  timezone: America/Sao_Paulo
  jwt:
    secret: dGVzdGUtc2VjcmV0LWtleS1wYXJhLXRlc3Rlcy1kZS1pbnRlZ3JhY2FvLTEyMzQ1Njc4OTA=
    expiration-ms: 7200000
    issuer: fila-atendimento-test
  fila:
    prefixo-padrao: A
  cors:
    allowed-origins: http://localhost:3000

logging:
  level:
    root: WARN
    br.com.capacitabrasil.fila: INFO
    org.springframework.web: INFO
