spring:
  application:
    name: fila-atendimento
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fila_atendimento}
    username: ${DB_USER:fila}
    password: ${DB_PASSWORD:fila123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # NAO definir hibernate.jdbc.time_zone: as colunas sao TIMESTAMP sem fuso
        # e o fuso e alinhado na JVM por TimeConfig. Definir aqui faria o
        # Hibernate converter LocalDateTime duas vezes.
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  jwt:
    secret: ${JWT_SECRET:Fqx9VeoV0l+BrzTaH+Y3XZTWT+tNlZduWd+92N01oJtVKEUFwYdApZF5bnmkHuvtkPFCyi/9xoAwKrY8M6T7tw==}
    expiration-ms: ${JWT_EXPIRATION_MS:7200000}
    issuer: fila-atendimento
  fila:
    prefixo-padrao: ${FILA_PREFIXO_PADRAO:A}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    br.com.capacitabrasil.fila: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"
