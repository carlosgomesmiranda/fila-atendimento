# =====================================================================
# Stack local: PostgreSQL 16 + API de Fila de Atendimento
#
# Uso:
#   cp .env.example .env      (opcional, ajuste os valores)
#   docker compose up --build
#
# API:      http://localhost:8080
# Swagger:  http://localhost:8080/swagger-ui.html
# Health:   http://localhost:8080/actuator/health
# =====================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: fila-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fila_atendimento}
      POSTGRES_USER: ${POSTGRES_USER:-fila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fila123}
      # Mantem CURRENT_TIMESTAMP do seed no mesmo fuso da aplicacao
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fila_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fila} -d ${POSTGRES_DB:-fila_atendimento}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fila-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fila_atendimento}
      DB_USER: ${POSTGRES_USER:-fila}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fila123}
      JWT_SECRET: ${JWT_SECRET:-Fqx9VeoV0l+BrzTaH+Y3XZTWT+tNlZduWd+92N01oJtVKEUFwYdApZF5bnmkHuvtkPFCyi/9xoAwKrY8M6T7tw==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-7200000}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
      FILA_PREFIXO_PADRAO: ${FILA_PREFIXO_PADRAO:-A}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      JAVA_OPTS: "${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport -Duser.timezone=America/Sao_Paulo}"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  fila_pgdata:
    name: fila_pgdata
