name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Permissao de execucao do Maven Wrapper
        run: chmod +x ./mvnw

      - name: Build, testes e gate de cobertura
        run: ./mvnw -B -ntp verify

      - name: Resumo da cobertura
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          {
            echo "### Resultado do build"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$CSV" ]; then
            awk -F, 'NR>1 {lm+=$8; lc+=$9} END {if (lm+lc>0) printf "- Cobertura de linhas: **%.2f%%** (%d de %d)\n", 100*lc/(lm+lc), lc, lm+lc}' "$CSV" >> "$GITHUB_STEP_SUMMARY"
            awk -F, 'NR>1 {bi+=$6; bc+=$7} END {if (bi+bc>0) printf "- Cobertura de branches: **%.2f%%** (%d de %d)\n", 100*bc/(bc+bi), bc, bc+bi}' "$CSV" >> "$GITHUB_STEP_SUMMARY"
            awk -F, 'END {printf "- Classes analisadas: **%d**\n", NR-1}' "$CSV" >> "$GITHUB_STEP_SUMMARY"
            awk -F, 'NR>1 {lm+=$8; lc+=$9} END {if (lm+lc>0) printf "- Gate de 80%% de linhas: **%s**\n", (100*lc/(lm+lc) >= 80 ? "atendido" : "violado")}' "$CSV" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Relatorio JaCoCo nao encontrado." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artefatos: \`jacoco-report\` (HTML) e \`surefire-reports\` (testes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: fila-atendimento:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validar docker compose
        run: docker compose config --quiet
